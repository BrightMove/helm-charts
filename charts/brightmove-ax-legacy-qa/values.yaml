namespace: brightmove-qa
dockerImageName: brightmove-ax-legacy
springProfiles: qa
env: qa
jvmHeapInit: 1g
jvmHeapMax: 1g
atsMaxActive: 150
atsUrl: jdbc:postgresql://lle.postgres.brightmove.com:5432/bmq1?currentSchema=ats_q
atsUser: ats_q
quartzUrl: jdbc:postgresql://lle.postgres.brightmove.com:5432/bmq1?currentSchema=ats_quartz_q
quartzUser: ats_q
memcached:
  cluster:
    discovery:
      endpoint: tomcat-sessions-lle2.fsaqmz.cfg.use1.cache.amazonaws.com:11211
  sessionManager:
    className: de.javakaffee.web.msm.MemcachedBackupSessionManager
msm:
  kryo:
    bufferSize:
      max: 5242880
driverClassName: org.postgresql.Driver
validationQuery: SELECT 1
xaDsType: org.postgresql.xa.PGXADataSource
xaDsFactory: org.apache.tomcat.jdbc.pool.DataSourceFactory
serviceAccount:
  name: brightmove-ax-legacy-qa
  roleArn: "arn:aws:iam::684955588137:role/ax-qa-secrets-role"
awsSecretsManager:
  region: us-east-1
  secretName: brightmove/qa/ax
appConfigSecretName: brightmove-ax-legacy-qa-app-config
