apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}-node
spec:
  # Sessions live in backend memory; keep at 1 replica.
  replicas: {{ default 1 .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-node
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-node
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: beta.kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      securityContext:
        fsGroup: 1001
      containers:
        - name: {{ .Release.Name }}-server
          image: 'brightmove/{{ .Values.dockerImageName }}:{{ .Chart.AppVersion }}'
          {{- if .Values.resources }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          # /api/healthz is proxied by Next.js to the FastAPI backend, so it
          # only passes when both processes are up.
          readinessProbe:
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
            httpGet:
              path: /api/healthz
              port: 3000
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 5
            httpGet:
              path: /api/healthz
              port: 3000
          env:
            - name: FRONTEND_URL
              value: "{{ .Values.frontendUrl }}"
          envFrom:
            - secretRef:
                name: {{ .Values.appConfigSecretName }}
                # Lets the pod start before credentials exist (externalSecret.enabled=false)
                optional: true
          ports:
            - containerPort: 3000
              name: node-port
          imagePullPolicy: Always
      serviceAccountName: {{ .Values.serviceAccount.name }}
      imagePullSecrets:
        - name: regcred
      nodeSelector:
        role: general
