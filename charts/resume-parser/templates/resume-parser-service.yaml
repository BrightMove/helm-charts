apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}-node
spec:
  # The ALB ingress routes straight to pod IPs (target-type: ip), so no node port is needed.
  type: ClusterIP
  ports:
    - protocol: TCP
      name: tcp-80
      port: 80
      targetPort: web-port
  selector:
    app: {{ .Release.Name }}-node
