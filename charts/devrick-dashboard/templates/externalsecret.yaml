apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-app-config
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: {{ .Values.appConfigSecretName }}
  dataFrom:
    - extract:
        key: {{ .Values.awsSecretsManager.secretName }}
