namespace: brightmove-stage
dockerImageName: brightmove-ax-legacy
springProfiles: stage
env: stage
jvmHeapInit: 1g
jvmHeapMax: 1g
atsMaxActive: 150
atsUrl: jdbc:postgresql://lle.postgres.brightmove.com:5432/bmq1?currentSchema=ats_s
atsUser: ats_s
quartzUrl: jdbc:postgresql://lle.postgres.brightmove.com:5432/bmq1?currentSchema=ats_quartz_s
quartzUser: ats_s
memcached:
  cluster:
    discovery:
      endpoint: tomcat-sessions-lle2.fsaqmz.cfg.use1.cache.amazonaws.com:11211
  sessionManager:
    className: de.javakaffee.web.msm.MemcachedBackupSessionManager
msm:
  kryo:
    bufferSize:
      max: 5242880
driverClassName: org.postgresql.Driver
validationQuery: SELECT 1
xaDsType: org.postgresql.xa.PGXADataSource
xaDsFactory: org.apache.tomcat.jdbc.pool.DataSourceFactory
serviceAccount:
  name: brightmove-ax-legacy-stage
  roleArn: "arn:aws:iam::684955588137:role/ax-stage-secrets-role"
awsSecretsManager:
  region: us-east-1
  secretName: brightmove/stage/ax
appConfigSecretName: brightmove-ax-legacy-stage-app-config
