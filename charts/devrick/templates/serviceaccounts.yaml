{{- /* Coordinator: talks to the Kubernetes API to launch workers; carries the IRSA annotation for SQS. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "devrick.fullname" . }}-coordinator
  labels: {{- include "devrick.labels" . | nindent 4 }}
  {{- with .Values.coordinator.serviceAccountAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- /* Workers: no Kubernetes API access (the Job spec also disables the token mount). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "devrick.workerServiceAccount" . }}
  labels: {{- include "devrick.labels" . | nindent 4 }}
  {{- with .Values.workers.serviceAccountAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- if .Values.dashboard.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "devrick.fullname" . }}-dashboard
  labels: {{- include "devrick.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
