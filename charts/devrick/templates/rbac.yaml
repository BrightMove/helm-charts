{{- /* The coordinator creates, watches and deletes worker Jobs and their pods in this namespace only. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "devrick.fullname" . }}-coordinator
  labels: {{- include "devrick.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "devrick.fullname" . }}-coordinator
  labels: {{- include "devrick.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "devrick.fullname" . }}-coordinator
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "devrick.fullname" . }}-coordinator
  apiGroup: rbac.authorization.k8s.io
