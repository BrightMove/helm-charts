{{- /*
Two Secrets, so the coordinator and dashboard never receive the engine tokens:
  core   - database, RabbitMQ, Jira, Slack. Read by coordinator, dashboard AND workers.
  engine - CLAUDE_CODE_OAUTH_TOKEN, GH_TOKEN, CURSOR_API_KEY. Read by workers only.
Set secrets.<name>.existingSecret to use a Secret you manage yourself (external-secrets, sealed
secrets, ...) instead of having the chart create one from secrets.<name>.data.
*/}}
{{- if not .Values.secrets.core.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devrick.coreSecret" . }}
  labels: {{- include "devrick.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.core.data }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- if and .Values.secrets.mcp.json (not .Values.secrets.mcp.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devrick.mcpSecret" . }}
  labels: {{- include "devrick.labels" . | nindent 4 }}
type: Opaque
stringData:
  mcp.json: {{ .Values.secrets.mcp.json | quote }}
{{- end }}
{{- if not .Values.secrets.engine.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devrick.engineSecret" . }}
  labels: {{- include "devrick.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.engine.data }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
